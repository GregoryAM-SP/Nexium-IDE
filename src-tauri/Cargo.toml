[package]
name = "nexium-studio"
version = "0.1.0"
description = "Nexium Studio - a local code editor with an AI assistant"
edition = "2021"

[lib]
name = "nexium_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["time"] }

# WebView2 settings are only reachable through COM; the accelerator switch is
# read in `lib.rs` so the editor, not the browser, owns Ctrl+F and friends.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
