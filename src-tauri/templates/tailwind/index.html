<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <!-- Tailwind CSS in the browser: fine for prototypes. For production,
         build it with the Tailwind CLI or a bundler such as Vite. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <main class="mx-auto flex max-w-3xl flex-col gap-6 px-6 py-24">
      <h1 class="text-4xl font-bold tracking-tight">{{title}}</h1>
      <p class="text-lg text-slate-400">A Tailwind CSS starter page.</p>
      <div>
        <a
          href="#"
          class="inline-flex rounded-lg bg-sky-500 px-4 py-2 font-medium text-slate-950 hover:bg-sky-400"
          >Get started</a
        >
      </div>
    </main>
  </body>
</html>
