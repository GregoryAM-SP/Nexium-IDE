# Builds Nexium Studio for Windows and Linux and publishes a GitHub release
# whenever a version tag is pushed:
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Windows: NSIS installer (.exe) and MSI (.msi)
# Linux:   .deb, .rpm and .AppImage
# Updates: signed update files plus latest.json, which installed copies of the
#          app check (see plugins.updater in src-tauri/tauri.conf.json).
#
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the key has a password).
#
# Each installer type updates from its own kind of file: an MSI install from the
# .msi, an NSIS install from the .exe, a .deb from the .deb and so on. The app
# refuses anything else, and the publish job checks latest.json for it.
#
# The release is created as a draft, every platform uploads into it, and it is
# only published once all builds have succeeded — a failed build never leaves a
# half-filled public release behind. Tags with a pre-release part
# (v1.1.0-beta.1) are published as pre-releases.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  # Re-run a release by hand for an existing tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v1.0.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Read version from tag
        id: version
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not a version like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create (or reuse) the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        # The builds upload into this release by its numeric id. Listing
        # releases right after creating a draft can come back empty (that is
        # what left v1.0.0 without files), so the id is taken from the create
        # call itself, or looked up by tag with retries when it already exists.
        run: |
          id=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId 2>/dev/null || true)

          if [[ -n "$id" ]]; then
            echo "Release $TAG already exists (id $id); builds will upload into it."
          else
            id=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$TAG" \
              -f name="Nexium Studio $TAG" \
              -F draft=true \
              -F prerelease="$PRERELEASE" \
              -F generate_release_notes=true \
              --jq .id)
            echo "Created draft release $TAG (id $id)."
          fi

          for attempt in 1 2 3 4 5; do
            [[ -n "$id" ]] && break
            sleep 3
            id=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId 2>/dev/null || true)
          done

          if [[ -z "$id" ]]; then
            echo "::error::Could not find the release id for $TAG, so the builds would have nowhere to upload."
            exit 1
          fi

          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
          - name: Linux
            # The oldest supported Ubuntu, so the .deb/.AppImage run on older
            # glibc versions too.
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      # Fail in seconds, not after a full build, if there is nowhere to upload.
      - name: Check the release to upload into
        shell: bash
        run: |
          if [[ -z "${{ needs.create-release.outputs.release_id }}" ]]; then
            echo "::error::The create-release job did not report a release id."
            exit 1
          fi
          echo "Uploading into release id ${{ needs.create-release.outputs.release_id }}"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev libdbus-1-dev

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Stamp the version from the tag
        run: node scripts/set-version.mjs "${{ env.TAG }}"

      - name: Install frontend dependencies
        run: bun install

      # MSI (WiX) only accepts numeric versions, so a pre-release such as
      # v1.1.0-beta.1 ships the .exe installer on Windows but no .msi.
      - name: Choose bundles
        id: bundles
        shell: bash
        run: |
          bundles="${{ matrix.bundles }}"
          if [[ "${{ needs.create-release.outputs.prerelease }}" == "true" ]]; then
            bundles="${bundles//,msi/}"
          fi
          echo "list=$bundles" >> "$GITHUB_OUTPUT"

      - name: Check the update signing key is set
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY repository secret (the contents of ~/.tauri/nexium.key). See README → In-app updates."
            exit 1
          fi

      # Builds the installers, signs the update artifacts with the private key,
      # uploads everything to the draft release and merges this platform into
      # latest.json, which installed copies of the app read to find updates.
      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --bundles ${{ steps.bundles.outputs.list }}
          includeUpdaterJson: true
          # latest.json gets one entry per installer type (windows-x86_64-msi,
          # linux-x86_64-deb, …). This picks the .exe for the generic
          # windows-x86_64 entry, used only by copies of unknown install type.
          updaterJsonPreferNsis: true

  publish:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      # Never publish a release that is missing installers or the update
      # manifest: installed apps would see an update they cannot download.
      - name: Check every file was uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.create-release.outputs.prerelease }}
        run: |
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "Assets on $TAG:"
          echo "$assets" | sed 's/^/  /'

          expected=('-setup\.exe$' '\.deb$' '\.rpm$' '\.AppImage$' '^latest\.json$')
          if [[ "$PRERELEASE" != "true" ]]; then expected+=('\.msi$'); fi

          missing=0
          for pattern in "${expected[@]}"; do
            if ! grep -Eq "$pattern" <<< "$assets"; then
              echo "::error::No asset matching $pattern was uploaded to $TAG."
              missing=1
            fi
          done

          if [[ "$missing" == 1 ]]; then
            echo "::error::The release stays a draft. Re-run the failed build, or run this workflow by hand for $TAG."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      # Every installer type must find an update of its own kind, signed with
      # the signature of that exact file. Otherwise an MSI install would be
      # handed the .exe, or a .deb install the AppImage, and end up with two
      # copies of the app.
      - name: Check latest.json sends each installer its own update
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-update-manifest.mjs "$TAG"

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
